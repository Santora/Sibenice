name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Projektová stránka běží na https://<uživatel>.github.io/<repozitář>/, proto přepíšeme <base href>.
      # Dělá se PŘED publikací, aby seděly kontrolní součty v service-worker-assets.js.
      - name: Nastavit base href
        run: sed -i "s|<base href=\"/\" />|<base href=\"/${{ github.event.repository.name }}/\" />|" wwwroot/index.html

      - name: Publish
        run: dotnet publish SlovniHra.csproj -c Release -o release

      - name: Výpis publikovaného obsahu
        run: |
          echo "== release =="; ls -la release
          echo "== release/wwwroot =="; ls -la release/wwwroot
          echo "== _framework (blazor, dotnet.js) =="; ls release/wwwroot/_framework | grep -i 'blazor\|dotnet\.js' || true

      - name: Kontrola index.html
        run: |
          if grep -q '#\[' release/wwwroot/index.html; then
            echo "::error::V index.html zůstaly nedosazené zástupné znaky #[...]"
            grep -n 'blazor.webassembly\|importmap' release/wwwroot/index.html
            exit 1
          fi
          grep -n 'blazor.webassembly' release/wwwroot/index.html

      - name: Příprava pro Pages
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
