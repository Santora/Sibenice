<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1b1f3b" />
    <title>Šibenice – slovní hra</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="manifest" href="manifest.webmanifest" />
</head>

<body>
    <div id="app">
        <div class="loading">Načítání…</div>
    </div>

    <div id="blazor-error-ui">
        Nastala neočekávaná chyba.
        <a href="." class="reload">Znovu načíst</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        window.hra = {
            getBest: () => parseInt(localStorage.getItem('sibenice.best') || '0', 10),
            setBest: v => localStorage.setItem('sibenice.best', String(v)),
            getSoloState: () => {
                try { return JSON.parse(localStorage.getItem('sibenice.solo') || 'null'); }
                catch { return null; }
            },
            setSoloState: state => localStorage.setItem('sibenice.solo', JSON.stringify(state)),
            clearSoloState: () => localStorage.removeItem('sibenice.solo')
        };
    </script>
    <script src="js/feedback.js"></script>
    <script src="js/net.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
